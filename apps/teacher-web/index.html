<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Classroom Guide · 교사</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">CLASSROOM GUIDE</p>
          <h1>학생 접속 현황</h1>
          <p class="subtitle">같은 Wi-Fi에 연결된 학생 노트북을 확인합니다.</p>
        </div>
        <div id="server-status" class="status connecting">서버 연결 중</div>
      </header>

      <section class="summary" aria-live="polite">
        <span>현재 온라인</span>
        <strong id="online-count">0명</strong>
      </section>

      <section>
        <div id="empty-state" class="empty">
          <div class="empty-icon">⌁</div>
          <h2>아직 접속한 학생이 없습니다</h2>
          <p>학생 앱에서 이 컴퓨터의 서버 주소를 입력하면 여기에 표시됩니다.</p>
        </div>
        <div id="student-grid" class="student-grid" hidden></div>
      </section>

      <section id="viewer" class="viewer" hidden>
        <div class="viewer-header">
          <div><p class="eyebrow">LIVE SCREEN</p><h2 id="viewer-title">학생 화면</h2></div>
          <div class="viewer-actions"><span id="viewer-status">연결 중…</span><button id="close-viewer" type="button">화면 닫기</button></div>
        </div>
        <div class="video-frame"><video id="student-video" autoplay playsinline></video></div>
      </section>
    </main>
    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
  </body>
</html>
