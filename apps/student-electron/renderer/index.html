<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Classroom Guide · 학생</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">CLASSROOM GUIDE · STUDENT</p>
      <h1>수업에 참여하기</h1>
      <p class="lead">교사 서버를 자동으로 찾습니다. 처음 한 번만 노트북 번호를 입력하세요.</p>
      <form id="join-form">
        <label>교사 서버 주소 <span id="discovery-message" class="discovery-message">자동 검색 중…</span><input id="server-url" type="url" placeholder="자동으로 검색합니다" required /></label>
        <label>노트북 번호<input id="student-name" type="text" maxlength="20" inputmode="numeric" placeholder="예: 17" required /></label>
        <button type="submit">저장하고 연결하기</button>
      </form>
      <section id="connection-card" class="connection-card idle" aria-live="polite">
        <span class="indicator"></span>
          <div><strong id="status-title">교사 서버 검색 중</strong><p id="status-message">같은 Wi-Fi에서 교사 프로그램을 찾고 있습니다.</p></div>
      </section>
      <section id="sharing-card" class="sharing-card" hidden>
        <span class="sharing-icon">●</span>
        <div><strong id="sharing-title">화면 공유 중</strong><p id="sharing-message">교사가 화면을 확인하고 있습니다.</p></div>
      </section>
      <p id="device-info" class="device-info"></p>
    </main>
    <script src="streaming-client.js"></script>
    <script src="app.js"></script>
  </body>
</html>
